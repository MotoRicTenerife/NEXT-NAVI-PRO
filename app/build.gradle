plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def stableSigningPath = System.getenv('NEXT_NAVI_KEYSTORE_PATH')
def stableSigningStorePassword = System.getenv('NEXT_NAVI_KEYSTORE_PASSWORD')
def stableSigningAlias = System.getenv('NEXT_NAVI_KEY_ALIAS')
def stableSigningKeyPassword = System.getenv('NEXT_NAVI_KEY_PASSWORD')
def stableSigningReady = stableSigningPath && stableSigningStorePassword && stableSigningAlias && stableSigningKeyPassword && file(stableSigningPath).isFile()
def jarvisAiEndpoint = (System.getenv('NEXT_NAVI_AI_ENDPOINT') ?: '').replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.nextnavipro.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.nextnavipro.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.0-alpha07'
        buildConfigField 'String', 'JARVIS_AI_ENDPOINT', '"' + jarvisAiEndpoint + '"'
    }
    signingConfigs {
        if (stableSigningReady) {
            stable {
                storeFile file(stableSigningPath)
                storePassword stableSigningStorePassword
                keyAlias stableSigningAlias
                keyPassword stableSigningKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (stableSigningReady) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'org.maplibre.gl:android-sdk:11.11.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
