name: Android Emulator Smoke

on:
  push:
    branches: [feat/rollback-safe-app-backup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Alpha07 and run Android unit tests
        run: |
          gradle --no-daemon assembleDebug testDebugUnitTest
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch on Android emulator (portrait + landscape)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -skin 1080x2400
          disable-animations: true
          script: |
            set -euo pipefail
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.nextnavipro.app.debug 1
            for attempt in $(seq 1 30); do
              if adb shell pidof com.nextnavipro.app.debug >/dev/null 2>&1; then break; fi
              sleep 1
            done
            if ! adb shell pidof com.nextnavipro.app.debug >/dev/null 2>&1; then
              adb logcat -d -t 1200
              echo "Alpha07 did not stay running after launch."
              exit 1
            fi
            sleep 5
            if adb logcat -d -t 1500 | grep -E "FATAL EXCEPTION|Process: com.nextnavipro.app.debug" | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -t 1500
              echo "Fatal Android exception detected during Alpha07 startup."
              exit 1
            fi
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 2
            adb shell settings put system user_rotation 0
            sleep 2
            adb shell screencap -p /sdcard/alpha07-smoke.png
            adb pull /sdcard/alpha07-smoke.png alpha07-emulator-smoke.png
            echo "Alpha07 installed, launched and survived portrait/landscape rotation."
      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v5
        with:
          name: alpha07-emulator-smoke
          path: alpha07-emulator-smoke.png
          if-no-files-found: error
          retention-days: 7
