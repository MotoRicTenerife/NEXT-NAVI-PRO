name: Android CI
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run offline GPS trace analysis tests
        run: python -m unittest discover -s roadtools -p 'test_*.py'
      - name: Check Jarvis backend JavaScript syntax
        working-directory: backend/jarvis-render
        run: npm run check
      - name: Smoke-test deployed Jarvis endpoint (diagnostic)
        continue-on-error: true
        env:
          JARVIS_ENDPOINT: ${{ vars.NEXT_NAVI_AI_ENDPOINT || 'https://next-navi-pro-jarvis.onrender.com/jarvis' }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          endpoint = os.environ.get("JARVIS_ENDPOINT", "").strip()
          if not endpoint.startswith("https://") or not endpoint.endswith("/jarvis"):
              print("::warning::Jarvis endpoint is not configured as an HTTPS /jarvis URL.")
              sys.exit(1)
          health = endpoint[:-len("/jarvis")] + "/health"
          def request(url, data=None, timeout=25):
              req = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.status, response.read().decode("utf-8", "replace")
          try:
              status, body = request(health, timeout=35)
              info = json.loads(body)
              if status != 200 or info.get("ok") is not True:
                  raise RuntimeError("Health check returned an unexpected response")
              print("Jarvis health check passed:", body[:240])
              payload = json.dumps({
                  "message":"Che condizioni meteo ci sono?",
                  "language":"it-IT",
                  "location":{"latitude":28.0,"longitude":-16.7}
              }).encode()
              status, body = request(endpoint, payload, timeout=35)
              reply = json.loads(body).get("reply", "")
              if status != 200 or "Open-Meteo" not in reply:
                  raise RuntimeError("Weather smoke test did not return a verified Open-Meteo reply: " + body[:240])
              print("Jarvis live-weather smoke test passed:", reply[:300])
              chat_payload = json.dumps({
                  "message":"Rispondi soltanto con OK.",
                  "language":"it-IT"
              }).encode()
              status, body = request(endpoint, chat_payload, timeout=35)
              chat_reply = json.loads(body).get("reply", "")
              if status != 200 or not chat_reply.strip():
                  raise RuntimeError("Online AI smoke test failed: " + body[:240])
              print("Jarvis online-AI smoke test passed:", chat_reply[:160])
          except Exception as error:
              print("::warning::Jarvis live endpoint smoke test failed: " + str(error))
              print("The APK build continues, but online service readiness is NOT verified.")
              sys.exit(1)
          PY
      - name: Prepare persistent debug signing (optional)
        env:
          NEXT_NAVI_KEYSTORE_BASE64: ${{ secrets.NEXT_NAVI_KEYSTORE_BASE64 }}
          NEXT_NAVI_KEYSTORE_PASSWORD: ${{ secrets.NEXT_NAVI_KEYSTORE_PASSWORD }}
          NEXT_NAVI_KEY_ALIAS: ${{ secrets.NEXT_NAVI_KEY_ALIAS }}
          NEXT_NAVI_KEY_PASSWORD: ${{ secrets.NEXT_NAVI_KEY_PASSWORD }}
        run: |
          if [ -n "$NEXT_NAVI_KEYSTORE_BASE64" ] && [ -n "$NEXT_NAVI_KEYSTORE_PASSWORD" ] && [ -n "$NEXT_NAVI_KEY_ALIAS" ] && [ -n "$NEXT_NAVI_KEY_PASSWORD" ]; then
            echo "$NEXT_NAVI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next-navi-pro.keystore"
            echo "NEXT_NAVI_KEYSTORE_PATH=$RUNNER_TEMP/next-navi-pro.keystore" >> "$GITHUB_ENV"
            echo "Persistent APK signing configured."
          else
            echo "::warning::Persistent APK signing secrets are not configured yet."
          fi
      - name: Build debug APK
        env:
          NEXT_NAVI_AI_ENDPOINT: ${{ vars.NEXT_NAVI_AI_ENDPOINT || 'https://next-navi-pro-jarvis.onrender.com/jarvis' }}
          NEXT_NAVI_KEYSTORE_PASSWORD: ${{ secrets.NEXT_NAVI_KEYSTORE_PASSWORD }}
          NEXT_NAVI_KEY_ALIAS: ${{ secrets.NEXT_NAVI_KEY_ALIAS }}
          NEXT_NAVI_KEY_PASSWORD: ${{ secrets.NEXT_NAVI_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug
          if [ -z "$NEXT_NAVI_KEYSTORE_PATH" ]; then
            echo "::warning::Stable APK signing is not configured. CI will use a temporary Android debug key."
          else
            echo "Stable APK signing is enabled."
          fi
      - name: Run unit tests
        env:
          NEXT_NAVI_AI_ENDPOINT: ${{ vars.NEXT_NAVI_AI_ENDPOINT || 'https://next-navi-pro-jarvis.onrender.com/jarvis' }}
          NEXT_NAVI_KEYSTORE_PASSWORD: ${{ secrets.NEXT_NAVI_KEYSTORE_PASSWORD }}
          NEXT_NAVI_KEY_ALIAS: ${{ secrets.NEXT_NAVI_KEY_ALIAS }}
          NEXT_NAVI_KEY_PASSWORD: ${{ secrets.NEXT_NAVI_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: next-navi-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
